name: Build Thanwia-New APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Thanwia-New is standalone
        shell: bash
        run: |
          set -e
          test -s android_project/app/src/main/assets/www/index.html
          test -s android_project/app/src/main/assets/www/thanwia-new-app.js
          test -s android_project/app/src/main/assets/www/ai-question-engine.js
          grep -q 'Thanwia-New' android_project/app/src/main/assets/www/index.html
          grep -q 'thanwia-new-app.js' android_project/app/src/main/assets/www/index.html
          grep -q 'file:///android_asset/www/index.html' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-navigation-bootstrap.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'app-core-v10.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java
          ! grep -q 'friend-challenge-v2.js' android_project/app/src/main/java/com/rihla/thanaweya/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle --no-daemon -p android_project :app:assembleDebug

      - name: Verify clean APK
        shell: bash
        run: |
          set -e
          APK=android_project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/index.html | grep -q 'Thanwia-New'
          unzip -p "$APK" assets/www/thanwia-new-app.js | grep -q 'aenuzbaqskhyqwatrggg.supabase.co'
          unzip -p "$APK" assets/www/ai-question-engine.js | grep -q 'generate-ai-quiz'
          ! unzip -l "$APK" | grep -q 'assets/www/app-navigation-bootstrap.js'
          ! unzip -l "$APK" | grep -q 'assets/www/app-core-v10.js'
          ! unzip -l "$APK" | grep -q 'assets/www/friend-challenge-v2.js'
          ! unzip -l "$APK" | grep -q 'assets/www/subscription-v2.js'
          ! unzip -l "$APK" | grep -q 'assets/www/3d-modern.css'

      - uses: actions/upload-artifact@v4
        with:
          name: Thanwia-New-clean-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
