name: Add spaced error review
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add spaced error review
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          css='.review-due{background:#fff7e6;border:1px solid #ffd27a;border-radius:15px;padding:11px;margin-top:10px}.review-done{background:#eefaf5;border:1px solid #b9ead5;border-radius:15px;padding:10px;margin-top:10px}'
          s=s.replace('.error-item:last-child{border:0}', '.error-item:last-child{border:0}'+css, 1)
          old='<div class="card"><div class="row"><b>📕 دفتر أخطائي</b><span class="pill" id="errorCount">0</span></div><div id="errorLogList" style="margin-top:8px"><div class="muted">لم تسجل أخطاء بعد. أول خطأ فرصة للتعلم.</div></div></div>'
          new='''<div class="card"><div class="row"><b>📕 دفتر أخطائي</b><span class="pill" id="errorCount">0</span></div><div id="reviewSummary" class="muted" style="margin-top:8px">مراجعة ذكية كل 1، 3، 7 و14 يوم.</div><div id="errorLogList" style="margin-top:8px"><div class="muted">لم تسجل أخطاء بعد. أول خطأ فرصة للتعلم.</div></div></div>'''
          if 'id="reviewSummary"' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android_project/app/src/main/assets/www/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add spaced error review [manual]"
          git push
