name: Modern UI Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_project/app/src/main/assets/www/index.html'
      - '.github/workflows/modern-ui-build.yml'

permissions:
  contents: write

jobs:
  modern-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply modern visual system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* RIHLA MODERN UI V1 */'
          if marker not in s:
              css=r'''
          /* RIHLA MODERN UI V1 */
          :root{
            --navy:#071a33;--blue:#315efb;--cyan:#28b7f5;--bg:#f5f7fc;--card:rgba(255,255,255,.94);
            --text:#12213b;--muted:#748198;--green:#22c78b;--orange:#ffad3d;--red:#ef5968;
            --shadow:0 12px 34px rgba(23,48,88,.08);--shadow-lg:0 18px 48px rgba(23,48,88,.13)
          }
          html{scroll-behavior:smooth;background:var(--bg)}
          body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 100% 0,#e9f2ff 0,transparent 34%),radial-gradient(circle at 0 40%,#eefcff 0,transparent 28%),var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
          .app{max-width:560px;background:transparent;padding-bottom:92px}
          .screen{min-height:100vh}
          .content{padding:18px 15px 24px}
          .top{padding:24px 18px 28px;border-radius:0 0 30px 30px;background:linear-gradient(135deg,#071a33 0%,#174ea9 55%,#268de5 100%);box-shadow:0 12px 34px rgba(7,38,83,.18);position:relative;overflow:hidden}
          .top:after{content:"";position:absolute;width:170px;height:170px;border:1px solid rgba(255,255,255,.14);border-radius:50%;left:-65px;bottom:-90px;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 56px rgba(255,255,255,.025)}
          .top-row{position:relative;z-index:1}.top h1{font-size:23px;letter-spacing:-.4px}.top p{font-size:12px;color:#dceaff}
          .icon-btn{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.13);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
          .hero{border-radius:28px;padding:22px;min-height:205px;background:linear-gradient(145deg,#071d3a,#1557ad 58%,#2799e9);box-shadow:var(--shadow-lg);isolation:isolate}
          .hero:before{content:"";position:absolute;inset:auto -50px -90px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);z-index:-1}
          .hero:after{font-size:115px;left:8px;bottom:-18px;opacity:.13}
          .hero h2{font-size:30px;line-height:1.2;letter-spacing:-.6px}.hero p{font-size:13px;line-height:1.8}
          .btn{min-height:50px;border-radius:16px;background:linear-gradient(135deg,#315efb,#28a9ee);box-shadow:0 9px 22px rgba(49,94,251,.2);transition:transform .16s ease,box-shadow .16s ease}
          .btn:active{transform:scale(.98);box-shadow:0 5px 14px rgba(49,94,251,.18)}
          .btn.secondary{background:#eef3ff;color:#315efb;box-shadow:none}.btn.green{background:linear-gradient(135deg,#20b982,#2ed7a0)}.btn.danger{background:linear-gradient(135deg,#ee5263,#ff7380)}
          .card,.daily-plan,.stat,.subject{border:1px solid rgba(18,42,76,.055);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
          .card{border-radius:22px;padding:17px;margin-bottom:14px;background:var(--card);backdrop-filter:blur(12px)}
          .card:active,.subject:active{transform:scale(.995)}
          .stats{gap:10px}.stat{border-radius:19px;padding:14px 5px;background:rgba(255,255,255,.9)}.stat strong{font-size:23px;color:#18345b}.muted{font-size:11px}
          .progress{height:10px;background:#e8edf5}.progress i{background:linear-gradient(90deg,#315efb,#28b7f5);box-shadow:0 0 12px rgba(40,183,245,.25)}
          .grid{gap:11px}.subject{padding:16px;border-radius:20px;background:rgba(255,255,255,.94)}.subject .ico{font-size:30px}.subject.selected{border-color:#315efb;background:linear-gradient(145deg,#f0f4ff,#fff)}
          .pill,.tab{border-radius:999px}.pill{background:#eef3ff;color:#315efb}.tabs{gap:8px;padding-bottom:3px}.tab{padding:10px 14px;background:#e9eef6}.tab.active{background:#315efb;box-shadow:0 7px 16px rgba(49,94,251,.18)}
          .daily-plan{border-radius:22px;padding:17px;background:rgba(255,255,255,.95)}.daily-plan-title{font-size:19px}.plan-task{padding:14px 0}.plan-num{border-radius:13px;background:#edf3ff;color:#315efb}.plan-time{color:#315efb}
          .modern-datetime{border-radius:24px;padding:18px;background:linear-gradient(135deg,#071a33,#174ea9 62%,#258fe1);box-shadow:0 13px 32px rgba(7,29,58,.17)}.modern-datetime .time-line{font-size:34px}.modern-datetime .date-line{font-size:12px}
          .nav{height:78px;width:min(560px,100%);padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(15,45,80,.08);box-shadow:0 -8px 30px rgba(23,48,88,.07)}
          .nav button{font-size:10px;min-width:52px;padding:7px 5px;border-radius:15px;transition:background .15s,color .15s}.nav button.active{color:#315efb;background:#eef3ff}.nav .plus{width:52px;height:52px;border:4px solid #fff;margin-top:-28px;background:linear-gradient(135deg,#315efb,#28a9ee);box-shadow:0 10px 24px rgba(49,94,251,.28)}
          .timer{width:238px;height:238px;background:conic-gradient(#2bd093 0 72%,#dfe8f4 72%);box-shadow:0 18px 40px rgba(9,38,74,.12)}.timer:after{width:198px;height:198px;background:linear-gradient(145deg,#071f40,#0c315c)}.timer-in strong{font-size:42px}
          .quiz-q{font-size:21px;line-height:1.75}.answer{padding:15px;border:1px solid #e8edf4;background:#f7f9fc;border-radius:16px;transition:.15s}.answer:active{transform:scale(.99)}.answer.correct{background:#e5f9f0}.answer.wrong{background:#ffe9ec}
          .challenge-card{border-radius:24px;background:linear-gradient(135deg,#071d3a,#176bc9 65%,#27a4e8);box-shadow:var(--shadow-lg)}
          .achievement{gap:10px}.badge{border:1px solid #e9edf4;border-radius:19px;background:linear-gradient(145deg,#fff,#f5f8fc);box-shadow:0 8px 20px rgba(23,48,88,.05)}
          .friend{padding:14px 0}.avatar{width:44px;height:44px;border-radius:15px}.online-dot{box-shadow:0 0 0 4px #e6f8f1}
          .sheet{border-radius:28px 28px 0 0;box-shadow:0 -16px 50px rgba(3,16,35,.2)}.modal{backdrop-filter:blur(3px)}
          .auth-box{border-radius:27px}.input{border-radius:15px;border-color:#e1e7f0;outline:none}.input:focus{border-color:#315efb;box-shadow:0 0 0 4px rgba(49,94,251,.09)}
          .toast{border-radius:999px;box-shadow:0 10px 25px rgba(16,42,75,.22)}
          .review-due,.review-done{border-radius:17px}
          .list-item{padding:14px 0}
          .diligence-score{font-size:48px;background:linear-gradient(135deg,#315efb,#28a9ee);-webkit-background-clip:text;background-clip:text;color:transparent}
          .skill-box{border:1px solid #e8edf4;border-radius:17px;background:#f8faff}.error-item{padding:13px 0}
          .onboard{padding:30px 20px;background:radial-gradient(circle at 20% 10%,rgba(40,183,245,.2),transparent 28%),linear-gradient(155deg,#06182f,#0c4f99 62%,#1596d9)}.onboard .art{height:270px;font-size:145px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.18))}.onboard h1{font-size:36px;letter-spacing:-1px}.onboard p{font-size:14px;line-height:1.9}.welcome-actions{margin-top:28px}
          .celebrate-box{border-radius:30px}.celebrate-box .cup{font-size:88px}
          @media(max-width:370px){.content{padding-left:11px;padding-right:11px}.hero h2{font-size:26px}.stats{gap:6px}.stat{padding-left:2px;padding-right:2px}.nav button{min-width:46px}}
          @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
          @media(prefers-color-scheme:dark){
            :root{--bg:#07111f;--card:rgba(16,29,48,.94);--text:#edf4ff;--muted:#91a1b8;--shadow:0 12px 34px rgba(0,0,0,.24)}
            body{background:radial-gradient(circle at 100% 0,#102a4b 0,transparent 36%),var(--bg)}
            .card,.daily-plan,.stat,.subject{border-color:rgba(255,255,255,.06);background:var(--card)}
            .subject.selected{background:#102543}.stat strong{color:#edf4ff}.progress{background:#1b2b40}.tab{background:#16253a;color:#9dafc6}.tab.active{background:#315efb;color:#fff}.plan-note,.skill-box{background:#102036;color:#aab9cd}.answer{background:#102036;border-color:#20334b}.badge{background:#102036;border-color:#20334b}.nav{background:rgba(7,17,31,.9);border-color:rgba(255,255,255,.07)}.nav button.active{background:#122b4d}.input{background:#102036;color:#edf4ff;border-color:#263a53}.sheet,.auth-box{background:#0d1b2d;color:#edf4ff}.btn.secondary{background:#122b4d}.review-due{background:#332915;border-color:#705a2d}.review-done{background:#102d25;border-color:#245d4d}
          }
          '''
              s=s.replace('</head>', '<style>'+css+'</style>\n</head>', 1)
              p.write_text(s,encoding='utf-8')
          print('Modern UI V1 applied')
          PY

      - name: Commit UI changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android_project/app/src/main/assets/www/index.html
          if git diff --cached --quiet; then echo 'No UI changes'; else git commit -m 'Modernize app UI and visual system'; git push; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project
      - name: Verify APK contains modern UI
        run: |
          unzip -p android_project/app/build/outputs/apk/debug/app-debug.apk assets/www/index.html | grep -F 'RIHLA MODERN UI V1'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-modern-ui-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
