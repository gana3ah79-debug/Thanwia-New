name: Add Personalized Color Themes and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  themes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and fix Supabase publishable key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text(encoding='utf-8')
          key='sb_publishable_FqI5heK77syr-3QH2LPHg_E82vbq-0'
          s=re.sub(r"sb_publishable_[A-Za-z0-9_-]+",key,s)
          p.write_text(s,encoding='utf-8')
          if key not in s: raise SystemExit('Supabase key verification failed')
          PY

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rihla-thanaweya-color-themes-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
