name: Import Thanwia and connect new AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Thanwia-New
        uses: actions/checkout@v4

      - name: Save new AI files
        run: |
          mkdir -p /tmp/thanwia-ai
          cp -f android_project/app/src/main/assets/www/ai-question-engine.js /tmp/thanwia-ai/ai-question-engine.js
          cp -f android_project/app/src/main/assets/www/thanwia-ai-bridge.js /tmp/thanwia-ai/thanwia-ai-bridge.js
          cp -f supabase/functions/generate-ai-quiz/index.ts /tmp/thanwia-ai/generate-ai-quiz.ts
          cp -f supabase/migrations/001_ai_question_engine.sql /tmp/thanwia-ai/001_ai_question_engine.sql

      - name: Import original app
        run: |
          rm -rf /tmp/Thanwia
          git clone --depth 1 https://github.com/gana3ah79-debug/Thanwia.git /tmp/Thanwia
          rsync -a --delete --exclude='.git' /tmp/Thanwia/ ./

      - name: Restore new AI engine
        run: |
          mkdir -p android_project/app/src/main/assets/www
          mkdir -p supabase/functions/generate-ai-quiz
          mkdir -p supabase/migrations
          cp /tmp/thanwia-ai/ai-question-engine.js android_project/app/src/main/assets/www/ai-question-engine.js
          cp /tmp/thanwia-ai/thanwia-ai-bridge.js android_project/app/src/main/assets/www/thanwia-ai-bridge.js
          cp /tmp/thanwia-ai/generate-ai-quiz.ts supabase/functions/generate-ai-quiz/index.ts
          cp /tmp/thanwia-ai/001_ai_question_engine.sql supabase/migrations/001_ai_question_engine.sql

      - name: Connect engine to index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('android_project/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="ai-question-engine.js"></script>',
              '<script src="thanwia-ai-bridge.js"></script>'
          ]
          marker = '</body>'
          missing = [t for t in tags if t not in s]
          if missing:
              if marker in s:
                  s = s.replace(marker, '\n' + '\n'.join(missing) + '\n' + marker, 1)
              else:
                  s += '\n' + '\n'.join(missing) + '\n'
              p.write_text(s, encoding='utf-8')

      - name: Update app branding and Supabase placeholders
        shell: python
        run: |
          from pathlib import Path
          root = Path('android_project/app/src/main/assets/www')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.js','.html','.css','.json','.txt'}:
                  try:
                      s = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  s = s.replace('https://eclnddvupggxyythtpkv.supabase.co', 'https://YOUR-THANWIA-NEW-PROJECT.supabase.co')
                  p.write_text(s, encoding='utf-8')

      - name: Commit imported app
        run: |
          git config user.name 'Thanwia AI Builder'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Import Thanwia app and connect new AI question engine' || echo 'No changes to commit'
          git push
